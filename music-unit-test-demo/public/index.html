<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mini MP3 Library</title>
  <link rel="stylesheet" href="/style.css">
  <script defer src="/client.js"></script>
</head>
<body>
  <main>
    <h1>Mini MP3 Library</h1>
    <p>A small JavaScript project with unit tests and basic security checks.</p>

    <section id="loginSection">
      <h2>Login</h2>
      <form id="loginForm">
        <label>Username <input id="username" required autocomplete="username" value="demo"></label>
        <label>Password <input id="password" required type="password" autocomplete="current-password" placeholder="Enter password"></label>
        <button type="submit">Log in</button>
      </form>
      <p class="hint">Demo account: <strong>demo</strong> / <strong>DemoPass123!</strong></p>
    </section>

    <section id="musicSection" hidden>
      <div class="heading"><h2>Your MP3 files</h2><button type="button" id="logoutButton">Log out</button></div>
      <form id="uploadForm">
        <label>Choose an MP3 (10 MB max)
          <input id="mp3File" type="file" accept=".mp3,audio/mpeg" required>
        </label>
        <button type="submit">Upload MP3</button>
      </form>
      <h3>Uploaded music</h3>
      <ul id="fileList"></ul>
    </section>

    <p id="message" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
